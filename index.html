<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operation Blackout V7 Student</title><style>
:root{--bg:#061015;--p:#0d222b;--p2:#102d38;--text:#eaffff;--muted:#9cbec6;--cyan:#45e8ff;--red:#ff5268;--green:#48f59a;--amber:#ffd05c;--line:#28505b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#123541,var(--bg) 48%);color:var(--text);font:16px Segoe UI,Arial,sans-serif;min-height:100vh}.app{max-width:1150px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;gap:18px;align-items:center;background:#07161cef;border:1px solid var(--line);padding:12px 16px}.brand{font-weight:900;letter-spacing:.12em}.brand b{color:var(--red)}.stats{display:flex;gap:18px;flex-wrap:wrap}.stat{font-size:.72rem;color:var(--muted);text-transform:uppercase}.stat strong{display:block;color:white;font-size:1rem}.panel,.hero{background:linear-gradient(145deg,var(--p2),#09191f);border:1px solid var(--line);box-shadow:0 16px 45px #0008}.panel{padding:22px;margin-top:16px}.hero{text-align:center;padding:55px 24px;margin-top:16px}.hero h1{font-size:clamp(2.7rem,8vw,5.5rem);line-height:.92;margin:.18em}.kicker{font-weight:900;letter-spacing:.16em;color:var(--red)}p{color:var(--muted)}.btn{border:1px solid var(--cyan);background:#10333e;color:white;padding:11px 15px;border-radius:5px;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(1.17)}.btn.green{border-color:var(--green);background:#123b2a}.btn.ghost{border-color:var(--line);background:transparent}.input{padding:12px;background:#050d10;color:white;border:1px solid var(--line);border-radius:5px;min-width:240px;font-size:1rem}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.card{position:relative;min-height:170px;padding:18px;background:linear-gradient(145deg,var(--p2),#0a1c23);border:1px solid var(--line);cursor:pointer}.card:hover{border-color:var(--cyan);transform:translateY(-2px)}.card.done{border-color:var(--green)}.card.locked{opacity:.4;cursor:not-allowed}.num{color:var(--cyan);font-size:.78rem;font-weight:900}.badge{position:absolute;right:12px;top:12px;color:var(--amber);font-size:.76rem}.terminal,.cipher{background:#020708;border:1px solid #1c5144;padding:16px;font:700 1rem/1.7 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.terminal{color:#75ffad}.cipher{border-left:4px solid var(--cyan);font-size:1.2rem;color:white}.missionHead{display:flex;justify-content:space-between;gap:15px;align-items:start}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{padding:9px 12px;border:1px solid var(--line);background:transparent;color:white;cursor:pointer}.tab.active{border-color:var(--cyan);color:var(--cyan)}.stage{display:none}.stage.active{display:block}.questions{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.q{padding:12px;border:1px solid var(--line);background:#061318}.q code{display:block;color:var(--cyan);font-size:1.05rem;margin-bottom:8px}.q input{width:100%;padding:9px;background:#020708;color:white;border:1px solid var(--line)}.msg{display:none;padding:12px;margin-top:12px}.msg.ok{display:block;border:1px solid var(--green);color:var(--green)}.msg.bad{display:block;border:1px solid var(--red);color:#ff9aaa}.hint,.evidence{padding:13px;margin:12px 0;border-left:4px solid var(--amber);background:#2c2512;color:#ffe9ab}.modal{position:fixed;inset:0;background:#000d;z-index:8;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal>div{max-width:800px;max-height:90vh;overflow:auto;width:100%;padding:20px;background:#0b222a;border:1px solid var(--cyan)}.suspects{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.suspect{border:1px solid var(--line);padding:12px}.watermark{position:fixed;right:8px;bottom:7px;color:#fff2;font:700 12px Consolas}.small{font-size:.88rem}.rank{font-size:1.35rem;color:var(--green);font-weight:900}@media(max-width:760px){.grid{grid-template-columns:1fr}.suspects{grid-template-columns:1fr}.app{padding:8px}.top{align-items:flex-start}.stats{gap:9px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><b>●</b> OPERATION BLACKOUT</div><button class="btn ghost" onclick="caseFile()">📁 CASE FILE</button><div class="stats"><div class="stat">Mission ID<strong id="mid">---</strong></div><div class="stat">Time<strong id="timer">50:00</strong></div><div class="stat">Score<strong id="score">0 XP</strong></div><div class="stat">Flags<strong id="flags">0 / 6</strong></div></div></header><main id="screen"></main></div><div id="wm" class="watermark"></div><div id="modal" class="modal"><div id="modalBody"></div></div><script>
const $=s=>document.querySelector(s),screen=$('#screen');const WORDS=['GHOST','AGENT','SERVER','SHIELD','MALWARE','CYBER','FIREWALL','NETWORK','SECURE'];const GL=['⌜','┬','⌝','├','┼','┤','⌞','┴','⌟','⌜•','┬•','⌝•','├•','┼•','┤•','⌞•','┴•','⌟•','〈','∨','〉','〈•','∧•','〉•','◇','◇•'];
let G={team:'',id:'',seed:1,start:0,score:0,hints:0,done:{},evidence:[],caseByMission:{},cfg:{},bitsDone:[false,false,false],pigDone:[false,false,false],subDone:[false,false,false],caesarDone:[false,false,false],vigDone:[false,false,false]};let R=Math.random;
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function makeR(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function ri(a,b){return Math.floor(R()*(b-a+1))+a}function pick(a){return a[ri(0,a.length-1)]}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}function norm(s){return s.toUpperCase().replace(/[^A-Z0-9]/g,'')}function caesar(t,n){return [...t].map(c=>/[A-Z]/.test(c)?String.fromCharCode((c.charCodeAt(0)-65+n)%26+65):c).join('')}function vig(t,k){let j=0;return [...t].map(c=>/[A-Z]/.test(c)?String.fromCharCode((c.charCodeAt(0)-65+k.charCodeAt(j++%k.length)-65)%26+65):c).join('')}function pig(t,map){return [...t].map(c=>c===' '?'   ':GL[map[c.charCodeAt(0)-65]]).join(' ')}function sub(t,map){return [...t].map(c=>/[A-Z]/.test(c)?map[c.charCodeAt(0)-65]:c).join('')}
function setup(){R=makeR(G.seed);let c=G.cfg;c.caesarStages=[{text:pick(['CODE','LOCK','DATA','NODE','SAFE']),shift:ri(2,5)},{text:pick(['CYBER SHIELD','ACCESS CODE','SERVER LOCK','SECURE DATA']),shift:ri(3,7)},{text:pick(['PROTECT THE NETWORK','SECURE THE SCHOOL SERVER','DEFEND THE COMPUTER SYSTEM']),shift:ri(4,9)}];c.binary=[4,8,12].map(b=>({b,nums:Array.from({length:b===12?2:4},()=>ri(b===4?1:b===8?16:256,2**b-1))}));c.pig=Array.from({length:3},()=>({word:pick(WORDS),map:shuffle([...Array(26).keys()])}));c.subStages=[pick(['LOCK','CODE','DATA','SAFE','NODE']),pick(['ACCESS TOKEN','CYBER SHIELD','SERVER LOCK','SECRET CODE']),pick(['THE PASSWORD IS SHADOW','RECOVER THE ACCESS TOKEN','PROTECT THE SCHOOL NETWORK','SECURE THE SCHOOL SERVER'])];c.subMap=shuffle([...'ABCDEFGHIJKLMNOPQRSTUVWXYZ']).join('');c.vigStages=[{text:pick(['CODE','LOCK','SAFE','AGENT','VIPER']),key:pick(['KEY','RED','NET'])},{text:pick(['CYBER SHIELD','ACCESS CODE','SERVER LOCK','SECURE FILE']),key:pick(['DRAGON','CYBER','GUARD','SHIELD'])},{text:pick(['PROTECT THE NETWORK','SECURE THE SCHOOL SERVER','RECOVER THE SECRET FILE']),key:pick(['DRAGON','CYBER','SHIELD','GUARD'])}];c.mix=[pick(['CYBER','SHIELD','DRAGON','GUARD']),pick(['BREACHED','DEFENDED','RECOVERED','SECURED'])];c.frags=Array.from({length:6},()=>ri(1,9));save()}
function save(){localStorage.setItem('blackout_v7_student',JSON.stringify(G))}function load(){try{let x=JSON.parse(localStorage.getItem('blackout_v7_student'));if(x&&x.id){G=x;G.caseByMission=G.caseByMission||{};R=makeR(G.seed);return true}}catch(e){}return false}function update(){$('#mid').textContent=G.id||'---';$('#wm').textContent=G.id||'';$('#score').textContent=G.score+' XP';$('#flags').textContent=Object.keys(G.done).length+' / 6'}function tick(){setInterval(()=>{if(!G.start)return;let s=Math.max(0,3000-Math.floor((Date.now()-G.start)/1000));$('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000)}
function intro(){screen.innerHTML=`<section class="hero"><div class="kicker">⚠ SECURITY INCIDENT ACTIVE ⚠</div><h1>OPERATION<br>BLACKOUT</h1><p>A unique, randomised cyber mission will be generated for your team.</p><div class="row" style="justify-content:center"><input id="team" class="input" placeholder="Team callsign"><button class="btn" onclick="start()">BEGIN MISSION</button></div></section>`}function start(){G.team=$('#team').value.trim()||'CYBER UNIT';G.id=String.fromCharCode(65+ri(0,25))+String.fromCharCode(65+ri(0,25))+'-'+ri(1000,9999);G.seed=hash(G.id);G.start=Date.now();setup();update();dash()}
function dash(){update();let cards=[['INTERCEPTED TRANSMISSION','3-stage Caesar challenge',150],['BINARY BREACH','4, 8 and 12-bit',250],['STRANGE SYMBOLS','3 shuffled Pigpen challenges',200],["HACKER'S NOTEBOOK",'word, phrase and sentence',225],['CLASSIFIED FILE','3-stage Vigenère challenge',250],['UNKNOWN TRANSMISSION','Multi-stage analysis',300]];screen.innerHTML=`<section class="panel"><div class="missionHead"><div><div class="kicker">MISSION CONTROL</div><h2>${G.team}</h2></div><button class="btn ghost" onclick="caseFile()">CASE FILE</button></div></section><div class="grid">${cards.map((c,i)=>{let n=i+1,l=n===6&&Object.keys(G.done).length<4;return `<article class="card ${G.done[n]?'done':''} ${l?'locked':''}" onclick="${l?'':`mission(${n})`}"><span class="num">MISSION 0${n}</span><span class="badge">${G.done[n]?'✓ CAPTURED':l?'🔒 LOCKED':c[2]+' XP'}</span><h3>${c[0]}</h3><p>${c[1]}</p></article>`}).join('')}</div>${Object.keys(G.done).length===6?`<section class="panel" style="text-align:center;border-color:var(--green)"><div class="kicker" style="color:var(--green)">ALL FLAGS CAPTURED</div><h2>MASTER RECOVERY VAULT UNLOCKED</h2><p>Use your Case File and recovered evidence to restore the network.</p><button class="btn green" onclick="vault()">ENTER FINAL VAULT</button></section>`:`<section class="panel" style="text-align:center;opacity:.68"><div class="kicker">FINAL VAULT LOCKED</div><h2>Complete all six missions</h2><p>${Object.keys(G.done).length} / 6 flags captured.</p></section>`}`}
function shell(n,title,body){screen.innerHTML=`<section class="panel"><div class="missionHead"><div><div class="kicker">MISSION 0${n}</div><h2>${title}</h2></div><div class="row"><button class="btn ghost" onclick="caseFile()">📁 CASE FILE</button><button class="btn ghost" onclick="dash()">← CONTROL</button></div></div>${body}<div id="msg" class="msg"></div></section>`}function bad(t='ACCESS DENIED. Check your answer.'){let e=$('#msg');e.className='msg bad';e.textContent=t}function ok(t){let e=$('#msg');e.className='msg ok';e.textContent=t}function finish(n,pts,e){if(G.done[n])return dash();G.done[n]=1;G.score+=pts;G.evidence.push(e);G.caseByMission[n]={evidence:e,fragment:G.cfg.frags[n-1]};save();update();ok(`FLAG CAPTURED ✓  +${pts} XP  |  Fragment: ${G.cfg.frags[n-1]}`);setTimeout(dash,1300)}function mission(n){[0,m1,m2,m3,m4,m5,m6][n]()}function tab(type,i){document.querySelectorAll('.stage').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$('#'+type+i).classList.add('active');document.querySelectorAll('.tab')[i].classList.add('active')}
function paidHint(cost,text,id){if(G.score<cost)return bad('Not enough XP for this hint.');if(G[id])return;G.score-=cost;G.hints=(G.hints||0)+1;G[id]=true;save();update();let e=$('#'+id);if(e){e.className='hint';e.innerHTML='<b>HINT UNLOCKED (-'+cost+' XP)</b><br>'+text}}
function m1(){if(!G.caesarDone)G.caesarDone=[false,false,false];shell(1,'INTERCEPTED TRANSMISSION',`<p>Decrypt three Caesar messages that increase in difficulty.</p><div class="tabs">${['WORD','TWO WORDS','SENTENCE'].map((x,i)=>`<button class="tab ${i?'':'active'}" onclick="tab('c',${i})">${x}</button>`).join('')}</div>${G.cfg.caesarStages.map((q,i)=>`<div id="c${i}" class="stage ${i?'':'active'}"><h3>Stage ${i+1}: ${['Short Word','Two Words','Full Sentence'][i]}</h3><p class="small">Caesar shift: +${q.shift}</p><div class="cipher">${caesar(q.text,q.shift)}</div><div class="row"><input id="ca${i}" class="input" placeholder="Decrypted ${i===0?'word':i===1?'phrase':'sentence'}"><button class="btn" onclick="checkCaesar(${i})">VERIFY</button></div></div>`).join('')}<div class="evidence">STAGES CLEARED: <b id="cc">${G.caesarDone.filter(Boolean).length} / 3</b></div>`)}function checkCaesar(i){let q=G.cfg.caesarStages[i];if(norm($('#ca'+i).value)!==norm(q.text))return bad('Incorrect. Move each letter backwards by the stated shift.');G.caesarDone[i]=true;save();if(G.caesarDone.every(Boolean))finish(1,150,'Encrypted messages were deliberately left behind.');else{ok('STAGE CLEARED ✓');$('#cc').textContent=G.caesarDone.filter(Boolean).length+' / 3';tab('c',G.caesarDone.findIndex(x=>!x))}}
function m2(){shell(2,'BINARY BREACH',`<p>Clear all three conversion levels.</p><div class="tabs">${G.cfg.binary.map((q,i)=>`<button class="tab ${i?'':'active'}" onclick="tab('b',${i})">${q.b}-BIT</button>`).join('')}</div>${G.cfg.binary.map((q,i)=>`<div id="b${i}" class="stage ${i?'':'active'}"><div class="questions">${q.nums.map((x,j)=>`<label class="q"><code>${x.toString(2).padStart(q.b,'0')}</code><input type="number" id="bv${i}_${j}" placeholder="Denary"></label>`).join('')}</div><div class="row"><button class="btn" onclick="checkBits(${i})">VERIFY</button><button class="btn ghost" onclick="$('#pv${i}').textContent='Place values: '+[...Array(${q.b})].map((_,k)=>2**(${q.b}-k-1)).join(' | ')">SHOW PLACE VALUES</button></div><p id="pv${i}"></p></div>`).join('')}<div class="evidence">LEVELS CLEARED: <b id="bc">${G.bitsDone.filter(Boolean).length} / 3</b></div>`)}function checkBits(i){let q=G.cfg.binary[i];if(!q.nums.every((x,j)=>Number($('#bv'+i+'_'+j).value)===x))return bad();G.bitsDone[i]=true;save();if(G.bitsDone.every(Boolean))finish(2,250,'The server revealed the keyword DRAGON.');else{ok('LEVEL CLEARED ✓');$('#bc').textContent=G.bitsDone.filter(Boolean).length+' / 3';tab('b',G.bitsDone.findIndex(x=>!x))}}
function m3(){shell(3,'STRANGE SYMBOLS',`<p>Decode three Pigpen messages. Each uses a newly shuffled symbol alphabet.</p><div class="tabs">${G.cfg.pig.map((_,i)=>`<button class="tab ${i?'':'active'}" onclick="tab('p',${i})">MESSAGE ${i+1}</button>`).join('')}</div>${G.cfg.pig.map((q,i)=>`<div id="p${i}" class="stage ${i?'':'active'}"><div class="cipher" style="font-size:1.6rem">${pig(q.word,q.map)}</div><div class="row"><input id="pa${i}" class="input" placeholder="Decoded keyword"><button class="btn" onclick="checkPig(${i})">VERIFY</button><button class="btn ghost" onclick="pigRef(${i})">OPEN SHUFFLED KEY</button></div></div>`).join('')}<div class="evidence">MESSAGES CLEARED: <b id="pc">${G.pigDone.filter(Boolean).length} / 3</b></div>`)}function pigRef(i){let q=G.cfg.pig[i];modal(`<h2>Shuffled Pigpen Key ${i+1}</h2><div class="cipher">${[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(c=>c+' = '+pig(c,q.map)).join(' &nbsp; ')}</div><button class="btn" onclick="closeModal()">CLOSE</button>`)}function checkPig(i){if(norm($('#pa'+i).value)!==G.cfg.pig[i].word)return bad('Incorrect for this shuffled key.');G.pigDone[i]=true;save();if(G.pigDone.every(Boolean))finish(3,200,'Three changing Pigpen alphabets were used.');else{ok('MESSAGE CLEARED ✓');$('#pc').textContent=G.pigDone.filter(Boolean).length+' / 3';tab('p',G.pigDone.findIndex(x=>!x))}}
function m4(){let m=G.cfg.subMap;shell(4,"HACKER'S NOTEBOOK",`<p>Crack three substitution messages that increase in difficulty.</p><div class="terminal">PLAIN : ABCDEFGHIJKLMNOPQRSTUVWXYZ\nCIPHER: ${m}</div><div class="tabs">${['WORD','TWO WORDS','SENTENCE'].map((x,i)=>`<button class="tab ${i?'':'active'}" onclick="tab('s',${i})">${x}</button>`).join('')}</div>${G.cfg.subStages.map((t,i)=>`<div id="s${i}" class="stage ${i?'':'active'}"><h3>Stage ${i+1}: ${['Short Word','Two Words','Full Sentence'][i]}</h3><div class="cipher">${sub(t,m)}</div><div class="row"><input id="sa${i}" class="input" placeholder="Decrypted ${i===0?'word':i===1?'phrase':'sentence'}"><button class="btn" onclick="checkSub(${i})">VERIFY</button></div></div>`).join('')}<div class="evidence">STAGES CLEARED: <b id="sc">${G.subDone.filter(Boolean).length} / 3</b></div>`)}function checkSub(i){if(norm($('#sa'+i).value)!==norm(G.cfg.subStages[i]))return bad('Incorrect. Recheck the substitution alphabet.');G.subDone[i]=true;save();if(G.subDone.every(Boolean))finish(4,225,'The attacker uses replacement alphabets.');else{ok('STAGE CLEARED ✓');$('#sc').textContent=G.subDone.filter(Boolean).length+' / 3';tab('s',G.subDone.findIndex(x=>!x))}}
function m5(){if(!G.vigDone)G.vigDone=[false,false,false];shell(5,'CLASSIFIED FILE',`<p>Decrypt three Vigenère messages that increase in difficulty. The key changes at each stage.</p><div class="tabs">${['WORD','TWO WORDS','SENTENCE'].map((x,i)=>`<button class="tab ${i?'':'active'}" onclick="tab('v',${i})">${x}</button>`).join('')}</div>${G.cfg.vigStages.map((q,i)=>`<div id="v${i}" class="stage ${i?'':'active'}"><h3>Stage ${i+1}: ${['Short Word','Two Words','Full Sentence'][i]}</h3><div class="terminal">ENCRYPTION: VIGENERE\nKEY: ${q.key}</div><div class="cipher">${vig(q.text,q.key)}</div><div class="row"><input id="va${i}" class="input" placeholder="Decrypted ${i===0?'word':i===1?'phrase':'sentence'}"><button class="btn" onclick="checkVig(${i})">VERIFY</button></div></div>`).join('')}<div class="evidence">STAGES CLEARED: <b id="vc">${G.vigDone.filter(Boolean).length} / 3</b></div>`)}function checkVig(i){let q=G.cfg.vigStages[i];if(norm($('#va'+i).value)!==norm(q.text))return bad('Incorrect. Recheck the Vigenère key and ciphertext.');G.vigDone[i]=true;save();if(G.vigDone.every(Boolean))finish(5,250,'The attacker repeatedly uses keyword encryption.');else{ok('STAGE CLEARED ✓');$('#vc').textContent=G.vigDone.filter(Boolean).length+' / 3';tab('v',G.vigDone.findIndex(x=>!x))}}
function m6(){let[k,a]=G.cfg.mix,codes=[...k].map(x=>(x.charCodeAt(0)-64).toString(2).padStart(5,'0')).join(' ');shell(6,'UNKNOWN TRANSMISSION',`<p>Layer 1 uses A=1 to Z=26. Its answer is the Vigenère key for Layer 2.</p><div class="cipher">${codes}</div><input id="key" class="input" placeholder="Recovered key"><div class="cipher" style="margin-top:12px">${vig(a,k)}</div><div class="row"><input id="a" class="input" placeholder="Final keyword"><button class="btn" onclick="norm($('#key').value)==='${k}'&&norm($('#a').value)==='${a}'?finish(6,300,'Final evidence confirms keyword dependence.'):bad()">SUBMIT</button></div>`)}
function caseFile(){let names=['CAESAR','BINARY','PIGPEN','SUBSTITUTION','VIGENERE','UNKNOWN TRANSMISSION'];let fallback=['Encrypted messages were deliberately left behind.','The server revealed the keyword DRAGON.','Three changing Pigpen alphabets were used.','The attacker uses replacement alphabets.','The attacker repeatedly uses keyword encryption.','Final evidence confirms keyword dependence.'];let records=names.map((name,i)=>{let n=i+1,done=!!G.done[n],rec=G.caseByMission[n]||{};return `<div class="evidence" style="opacity:${done?1:.55}"><b>MISSION 0${n} — ${name}</b><br>${done?(rec.evidence||fallback[i]):'Evidence not yet recovered.'}<br><br><span class="small">RECOVERY FRAGMENT</span><br><strong style="font-size:1.8rem;color:${done?'var(--green)':'var(--muted)'}">${done?(rec.fragment??G.cfg.frags[i]):'LOCKED'}</strong></div>`}).join('');modal(`<div class="kicker">PERMANENT CASE FILE</div><h2>${Object.keys(G.done).length} / 6 MISSIONS RECOVERED</h2><p>Return here at any point to review evidence and recovery fragments.</p>${records}<button class="btn" onclick="closeModal()">CLOSE CASE FILE</button>`)}
function vault(){let f=G.cfg.frags,code=''+f[1]+f[0]+f[2]+f[4]+f[3]+f[5];G.cfg.code=code;save();shell(7,'MASTER RECOVERY VAULT',`<p>Use the permanent Case File and the recovery protocol clues to determine the six-digit code.</p><div class="terminal">RECOVERY PROTOCOL CLUES\n\n1. The BINARY fragment comes first.\n2. The CAESAR fragment is immediately before PIGPEN.\n3. PIGPEN comes before VIGENERE.\n4. VIGENERE is immediately before SUBSTITUTION.\n5. UNKNOWN TRANSMISSION comes last.</div><button class="btn ghost" onclick="caseFile()">📁 OPEN CASE FILE</button><div class="row"><button class="btn" onclick="paidHint(100,'Start with the Binary fragment. The Unknown Transmission fragment is the final digit.','finalHint1')">HINT 1 · 100 XP</button><button class="btn" onclick="paidHint(150,'Caesar and Pigpen form a pair, with Caesar immediately before Pigpen.','finalHint2')">HINT 2 · 150 XP</button><button class="btn" onclick="paidHint(200,'For the suspect, compare the Case File evidence about keyword encryption with the suspect descriptions.','finalHint3')">HINT 3 · 200 XP</button></div><div id="finalHint1"></div><div id="finalHint2"></div><div id="finalHint3"></div><h3>Suspect database</h3><div class="suspects"><div class="suspect"><b>ZERO</b><p>Numerical shifts</p></div><div class="suspect"><b>BYTE</b><p>Binary messages</p></div><div class="suspect"><b>GHOST</b><p>Graphical symbols</p></div><div class="suspect"><b>VIPER</b><p>Repeating keywords; known keyword DRAGON</p></div></div><div class="row"><input id="code" class="input" inputmode="numeric" maxlength="6" placeholder="Six-digit recovery code"><select id="who" class="input"><option>Choose suspect</option><option>ZERO</option><option>BYTE</option><option>GHOST</option><option>VIPER</option></select><button class="btn green" onclick="finale()">AUTHORISE</button></div>`)}
function finale(){if($('#code').value!==G.cfg.code||$('#who').value!=='VIPER')return bad();let elapsed=Math.max(0,Math.floor((Date.now()-G.start)/1000)),remaining=Math.max(0,3000-elapsed),fmt=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'),completed=Object.keys(G.done).length;screen.innerHTML=`<section class="hero" style="border-color:var(--green)"><div class="kicker" style="color:var(--green)">MISSION COMPLETE</div><h1 style="color:var(--green)">NETWORK<br>SECURED</h1><div class="terminal" style="text-align:left">IDENTITY VERIFIED....... ✓\nATTACKER ISOLATED....... ✓\nFILES RESTORED.......... ✓\nFIREWALL ONLINE......... ✓</div><h2>FLAG{NETWORK_SECURED}</h2><div class="grid" style="margin-top:22px;text-align:left"><div class="card done"><span class="num">TOTAL XP</span><h2>${G.score}</h2><p>Final score after hint costs.</p></div><div class="card done"><span class="num">HINTS USED</span><h2>${G.hints||0}</h2><p>Includes final-vault hints.</p></div><div class="card done"><span class="num">TIME REMAINING</span><h2>${fmt(remaining)}</h2><p>From the 50:00 mission timer.</p></div><div class="card done"><span class="num">TIME USED</span><h2>${fmt(elapsed)}</h2><p>Total mission time.</p></div><div class="card done"><span class="num">FLAGS CAPTURED</span><h2>${completed} / 6</h2><p>All mission flags recovered.</p></div><div class="card done"><span class="num">MISSION ID</span><h2>${G.id}</h2><p>${G.team}</p></div></div><div class="rank" style="margin:24px">${G.score>=1150?'ELITE CODEBREAKER':G.score>=850?'CYBER DEFENDER':'NETWORK ANALYST'}</div><button class="btn ghost" onclick="reset()">START NEW MISSION</button></section>`}function modal(h){$('#modalBody').innerHTML=h;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}function reset(){localStorage.removeItem('blackout_v7_student');location.reload()}if(load()){update();dash()}else intro();tick();
</script></body></html>
